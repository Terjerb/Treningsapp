.badge{display:inline-block;border-radius:999px;padding:5px 9px;background:var(--accent2);color:#1e40af;font-size:11px;font-weight:750}.badge.ok{background:var(--okbg);color:var(--ok)}.badge.warn{background:var(--warnbg);color:var(--warn)}
.hero{background:linear-gradient(135deg,#1e293b,#0f172a);color:white}.hero .muted{color:#cbd5e1}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.quick button{padding:9px 5px;font-size:11px;background:rgba(255,255,255,.12)}

.weekbar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{background:#e2e8f0;border-radius:10px;text-align:center;padding:7px 2px;font-size:10px}.day.today{outline:2px solid var(--accent)}.day.done{background:var(--okbg);color:#166534}.day.planned{background:#dbeafe;color:#1e40af}

body{background:#f7f9fc}.app-shell{min-height:100vh}.desktop-brand{display:none}.dashboard-grid{display:grid;gap:12px}.dashboard-kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.dash-kpi{background:#fff;border:1px solid #e7edf5;border-radius:16px;padding:14px;min-width:0}.dash-kpi .big{font-size:28px;font-weight:900;line-height:1.05}.dash-kpi .label{font-size:12px;color:#64748b;margin-bottom:8px}.dashboard-two{display:grid;gap:12px}.panel-title{display:flex;align-items:center;justify-content:space-between;gap:10px}.plan-row{display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}.plan-row:first-child{border-top:0}.plan-day{font-weight:800;font-size:12px}.plan-name{font-weight:750}.plan-detail{font-size:11px;color:var(--muted);margin-top:2px}.status-dot{width:10px;height:10px;border-radius:50%;border:2px solid #cbd5e1}.status-dot.done{border-color:#22c55e;background:#22c55e}.zone-list{display:grid;gap:8px;margin-top:10px}.zone-row{display:grid;grid-template-columns:70px 1fr 78px;gap:8px;align-items:center;font-size:12px}.zone-bar{height:10px;border-radius:99px;background:#e5e7eb;overflow:hidden}.zone-fill{height:100%;border-radius:99px}.z1{background:#3b82f6}.z2{background:#22c55e}.z3{background:#facc15}.z4{background:#f97316}.z5{background:#ef4444}.goal-ring{width:116px;height:116px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--blue) var(--goal,0%),#e5e7eb 0);position:relative;margin:auto}.goal-ring:after{content:'';position:absolute;inset:12px;border-radius:50%;background:#fff}.goal-ring span{position:relative;z-index:1;font-size:25px;font-weight:900}.mapbox{height:260px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#eef2f7}.mini-map{height:220px}.route-fallback{width:100%;height:100%;display:block;background:linear-gradient(135deg,#eef7f1,#edf4fb)}.route-fallback polyline{fill:none;stroke:#2563eb;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.route-fallback circle{fill:#16a34a}.route-fallback circle.end{fill:#ef4444}.section-tabs{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.section-tabs button{white-space:nowrap;background:#eef2f7;color:#334155}.section-tabs button.active{background:#dbeafe;color:#1d4ed8}.week-card{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}.week-card.current{border-color:#93c5fd;background:#f8fbff}.exercise-summary{margin:5px 0 0;padding-left:17px;color:#64748b;font-size:11px}.welcome{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}.welcome h2{font-size:26px;margin:0}.welcome .muted{font-size:13px}.race-card{background:linear-gradient(145deg,#fff,#f5f8ff)}.leaflet-control-attribution{font-size:9px!important}.leaflet-container{font:inherit}.gpx-drop{border:1.5px dashed #93c5fd;border-radius:14px;padding:14px;background:#f8fbff}.dashboard-banner{background:linear-gradient(90deg,#eff6ff,#eef2ff);border:1px solid #dbeafe;border-radius:16px;padding:14px;color:#1e40af}.week-total{display:flex;gap:18px;flex-wrap:wrap}.week-total b{font-size:20px}.pace{font-variant-numeric:tabular-nums}

 body{background:#f8fafc}header{display:none}main{max-width:1250px;margin:0 0 0 220px;padding:28px 28px 55px}.desktop-brand{display:block;position:fixed;left:0;top:0;bottom:0;width:220px;background:var(--side);border-right:1px solid #e6ecf4;z-index:40;padding:25px 18px}.desktop-brand .brand-title{font-size:18px;font-weight:900}.desktop-brand .brand-sub{font-size:11px;color:#64748b;margin-top:2px}.desktop-brand .profile{position:absolute;bottom:22px;left:18px;right:18px;padding:12px;border:1px solid #e2e8f0;border-radius:14px;background:#fff}.desktop-brand .profile b{display:block}.desktop-brand .profile small{color:#64748b}nav{position:fixed;left:0;top:88px;bottom:auto;right:auto;width:220px;z-index:45;background:transparent;border:0;display:block;padding:0 12px}nav button{display:block;width:100%;max-width:none;text-align:left;border-radius:10px;padding:11px 12px;margin:3px 0;font-size:12px;background:transparent;color:#334155}nav button.active{background:#eaf2ff;color:#1d4ed8}.dashboard-kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.dashboard-two{grid-template-columns:1.05fr .95fr}.dashboard-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{border:1px solid #e8edf4;box-shadow:0 4px 18px rgba(15,23,42,.035)}.mini-map{height:310px}.dashboard-main{display:grid;grid-template-columns:1fr 1fr;gap:12px}.dashboard-main>.card{margin-bottom:0}.desktop-profile-spacer{height:100px}}
@media(max-width:899px){.desktop-brand{display:none}.dashboard-grid.three{grid-template-columns:1fr}.welcome h2{font-size:23px}nav{overflow-x:auto;justify-content:flex-start}nav button{min-width:72px}.dashboard-kpis{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.dashboard-kpis{grid-template-columns:1fr 1fr}.dash-kpi .big{font-size:23px}.plan-row{grid-template-columns:48px 1fr auto}.zone-row{grid-template-columns:56px 1fr 68px}.welcome{align-items:center}}

<body>
<div class="desktop-brand"><div class="brand-title">🏃 Terjes løpeplan</div><div class="brand-sub">Backyard Ultra · 17. april 2027</div><div class="profile"><b>Terje</b><small>Mål: Backyard Ultra</small></div></div>
<header><h1>Terjes treningsapp</h1><p>Backyard Ultra · 17. april 2027 · terskelpuls 168</p></header>
<main>
<section id="home" class="page active"></section>
<section id="plan" class="page"></section>
<section id="workout" class="page"></section>
<section id="interval" class="page"></section>
<section id="backyard" class="page"></section>
<section id="map" class="page"></section>
<section id="progress" class="page"></section>
<section id="history" class="page"></section>
<section id="settings" class="page"></section>
</main>
<nav>
<button data-page="home" class="active">⌂ Dashboard</button><button data-page="plan">▦ Treningsplan</button><button data-page="workout">◉ Økter</button><button data-page="interval">◷ Intervall</button><button data-page="backyard">⚑ Backyard</button><button data-page="map">⌖ Kart & ruter</button><button data-page="progress">↗ Fremgang</button><button data-page="history">≡ Historikk</button><button data-page="settings">⚙ Innstillinger</button>
</nav>
<div id="toast" class="toast"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const DB={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){localStorage.setItem(k,JSON.stringify(v))}};
const defaultSettings={maxHr:188,lthr:168,zoneLow:135,zoneHigh:145,protein:190,calories:2700,creatine:5,startDate:'2026-08-24',raceDate:'2027-04-17'};
const strength={
 mon:{name:'Styrke A – kort',type:'strength',ex:[
  {n:'Knebøy',sets:3,min:5,max:5,inc:2.5},{n:'Benkpress',sets:3,min:5,max:5,inc:2.5},{n:'Bulgarsk splittknebøy',sets:2,min:8,max:8,inc:2.5,note:'per bein'},{n:'Stående tåhev',sets:3,min:12,max:15,inc:2.5}]},
 fri:{name:'Styrke B – kort',type:'strength',ex:[
  {n:'Markløft',sets:3,min:5,max:5,inc:2.5},{n:'Benkpress',sets:3,min:5,max:5,inc:2.5},{n:'Kabelroing / nedtrekk',sets:2,min:8,max:12,inc:2.5},{n:'Sittende tåhev',sets:3,min:12,max:15,inc:2.5},{n:'Pallof press',sets:2,min:10,max:10,inc:1.25,note:'per side'}]},
 maint:{name:'Styrke – vedlikehold',type:'strength',ex:[
  {n:'Knebøy',sets:2,min:5,max:5,inc:2.5,note:'lett/moderat'},{n:'Benkpress',sets:2,min:5,max:5,inc:2.5},{n:'Kabelroing / nedtrekk',sets:2,min:8,max:10,inc:2.5},{n:'Sittende tåhev',sets:2,min:12,max:15,inc:2.5}]}
};
const intervalPlan=[
 ['4 × 4 min',4,4,2],['5 × 5 min',5,5,2],['3 × 8 min',3,8,3],['6 × 2 min – lett',6,2,2],
 ['4 × 4 min',4,4,2],['5 × 5 min',5,5,2],['3 × 8 min',3,8,3],['4 × 3 min – lett',4,3,2],
 ['4 × 5 min',4,5,2],['3 × 8 min',3,8,3],['5 × 5 min',5,5,2],['5 × 3 min – lett',5,3,2],
 ['4 × 6 min',4,6,2],['3 × 10 min',3,10,3],['5 × 5 min',5,5,2],['4 × 3 min – lett',4,3,2],
 ['4 × 5 min',4,5,2],['3 × 8 min',3,8,3],['5 × 3 min – lett',5,3,2],['4 × 5 min',4,5,2],
 ['3 × 10 min',3,10,3],['5 × 5 min',5,5,2],['4 × 3 min – lett',4,3,2],['4 × 6 min',4,6,2],
 ['4 × 5 min',4,5,2],['3 × 8 min',3,8,3],['4 × 3 min – lett',4,3,2],['4 × 5 min',4,5,2],
 ['3 × 8 min',3,8,3],['Lett 4 × 3 min',4,3,2],['4 × 4 min kontrollert',4,4,2],['4 × 3 min',4,3,2],
 ['3 × 3 min lett',3,3,2],['20–25 min svært rolig',0,0,0]
].map(x=>({name:x[0],reps:x[1],work:x[2],rest:x[3]}));
const easyPlan=[45,50,55,45,55,60,60,45,60,60,65,50,65,65,70,50,65,60,45,70,70,75,50,75,70,60,50,70,60,50,50,45,40,30];
const longPlan=[90,105,120,90,120,130,140,100,130,140,150,105,150,160,180,120,150,165,120,180,195,210,120,210,210,0,120,0,180,0,120,90,60,0];
const backyardRounds={26:3,28:4,30:8};
const dayKeys=['sun','mon','tue','wed','thu','fri','sat'];
const dayNames={sun:'Søndag',mon:'Mandag',tue:'Tirsdag',wed:'Onsdag',thu:'Torsdag',fri:'Fredag',sat:'Lørdag'};
function iso(d=new Date()){const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)}
function fmtDate(s){return new Date(s+'T12:00:00').toLocaleDateString('nb-NO',{day:'numeric',month:'short',year:'numeric'})}
function settings(){return {...defaultSettings,...DB.get('settings',{})}}
function weekNo(date=new Date()){const start=new Date('2026-08-24T12:00:00');const d=new Date(date);const diff=Math.floor((d-start)/(86400000*7));return Math.max(1,Math.min(34,diff+1))}
function intervalHr(p){
 const n=p.name.toLowerCase();
 if(n.includes('3 × 8')||n.includes('3 × 10'))return '155–168 bpm · S3–S4';
 if(n.includes('lett')||n.includes('kontrollert'))return '155–168 bpm · kontrollert';
 return '160–175 bpm · S4 → S5 mot slutten';
}
function planned(key,w=weekNo()){
 if(key==='mon') return strength.mon;
 if(key==='fri') return strength.fri;
 if(key==='tue') return {name:'Rolig løping',type:'run',detail:`${easyPlan[w-1]} min · 135–145 bpm · S2 lav aerob`,minutes:easyPlan[w-1],hr:'135–145'};
 if(key==='thu'){
   const p=intervalPlan[w-1];
   if(w===34)return {name:'Svært rolig løping',type:'run',detail:'20–25 min · under 140 bpm',minutes:25,hr:'<140'};
   return {name:`Mølleintervall – ${p.name}`,type:'interval',detail:`10 min oppvarming · ${p.name} · ${p.rest} min rolig pause · nedjogg · ${intervalHr(p)}`,plan:p,hr:intervalHr(p)};
 }
 if(key==='sun'){
   if(backyardRounds[w])return {name:'Backyard-simulering',type:'run',detail:`${backyardRounds[w]} × 6,706 km · start hver hele time · primært 135–145 bpm`,rounds:backyardRounds[w],hr:'135–145'};
   if(longPlan[w-1])return {name:'Langtur – rolig',type:'run',detail:`${Math.floor(longPlan[w-1]/60)}:${String(longPlan[w-1]%60).padStart(2,'0')} t · mål 135–142 bpm · tillatt opp mot 145`,minutes:longPlan[w-1],hr:'135–142'};
   return {name:'Hvile / restitusjon',type:'rest',detail:'Ingen langtur planlagt'};
 }
 return {name:'Hvile',type:'rest',detail:'Lett aktivitet, mobilitet og restitusjon'};
}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function nav(page){$$('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$$('.page').forEach(p=>p.classList.toggle('active',p.id===page));render(page)}
$$('nav button').forEach(b=>b.onclick=()=>nav(b.dataset.page));
function todayKey(){return dayKeys[new Date().getDay()]}
function logs(){return DB.get('logs',[])}
function latestExercise(name){return [...logs()].reverse().find(l=>l.type==='strength'&&l.exercises?.some(e=>e.name===name))?.exercises.find(e=>e.name===name)}
function suggest(ex){const prev=latestExercise(ex.n);if(!prev)return {weight:'',text:'Ingen tidligere økt'};const completed=prev.sets.length>=ex.sets&&prev.sets.every(s=>(+s.reps||0)>=ex.max&&s.done);const w=+prev.sets[0]?.weight||0;return {weight:w?(completed?w+ex.inc:w):'',text:completed?`Forslag: ${w+ex.inc} kg`:`Gjenta ${w||'samme'} kg`}}
function weekStrip(){const now=new Date(),mon=new Date(now);mon.setDate(now.getDate()-((now.getDay()+6)%7));const ls=logs();return `<div class="weekbar">${[0,1,2,3,4,5,6].map((i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);const id=iso(d),done=ls.some(x=>x.date===id),key=['mon','tue','wed','thu','fri','sat','sun'][i],isPlan=['mon','tue','thu','fri','sun'].includes(key);return `<div class="day ${done?'done':isPlan?'planned':''} ${id===iso()?'today':''}">${['Ma','Ti','On','To','Fr','Lø','Sø'][i]}<br>${d.getDate()}</div>`}).join('')}</div>`}

function mondayOfWeek(w){const d=new Date('2026-08-24T12:00:00');d.setDate(d.getDate()+(w-1)*7);return d}
function dateForKey(w,key){const offs={mon:0,tue:1,wed:2,thu:3,fri:4,sat:5,sun:6};const d=mondayOfWeek(w);d.setDate(d.getDate()+offs[key]);return iso(d)}
function hrZones(){const t=settings().lthr||168;return [
 {z:'S1',name:'Oppvarming',min:Math.round(t*.65),max:Math.round(t*.80),pct:'65–80%',c:'z1'},
 {z:'S2',name:'Lav aerob',min:Math.round(t*.80),max:Math.round(t*.89),pct:'80–89%',c:'z2'},
 {z:'S3',name:'Høy aerob',min:Math.round(t*.89),max:Math.round(t*.95),pct:'89–95%',c:'z3'},
 {z:'S4',name:'Terskel',min:Math.round(t*.95),max:t,pct:'95–100%',c:'z4'},
 {z:'S5',name:'Maksimalt',min:t+1,max:null,pct:'>100%',c:'z5'}];}
function fmtDuration(min){if(!min)return '–';const h=Math.floor(min/60),m=Math.round(min%60);return h?`${h}t ${m?m+'m':''}`:`${m}m`}
function kmPaceFromLog(l){if(l.distance&&l.duration){const sec=l.duration*60/l.distance;return `${Math.floor(sec/60)}:${String(Math.round(sec%60)).padStart(2,'0')}/km`}return '–'}
function weekLogs(w=weekNo()){const start=mondayOfWeek(w);const end=new Date(start);end.setDate(end.getDate()+7);return logs().filter(l=>{const d=new Date(l.date+'T12:00:00');return d>=start&&d<end})}
function doneOn(date){return logs().some(l=>l.date===date)}
function daysToRace(){return Math.max(0,Math.ceil((new Date('2027-04-17T09:00:00')-new Date())/86400000))}
function raceProgress(){const start=new Date('2026-08-24T12:00:00'),race=new Date('2027-04-17T12:00:00'),now=new Date();return Math.max(0,Math.min(100,Math.round((now-start)/(race-start)*100)))}
function zoneMarkup(){return `<div class="zone-list">${hrZones().map((z,i)=>`<div class="zone-row"><b>${z.z}</b><div><div class="zone-bar"><div class="zone-fill ${z.c}" style="width:${[38,62,76,88,100][i]}%"></div></div><span class="muted">${z.name}</span></div><span style="text-align:right">${z.max?z.min+'–'+z.max:'>'+settings().lthr} bpm</span></div>`).join('')}</div>`}

let timerState={running:false,phase:'warmup',remaining:600,rep:1,set:1,handle:null,endAt:null};
const TIMER_KEY='intervalTimerState';
function saveTimerState(){const {handle,...state}=timerState;localStorage.setItem(TIMER_KEY,JSON.stringify(state))}
function loadTimerState(){try{const x=JSON.parse(localStorage.getItem(TIMER_KEY)||'null');if(x&&x.phase){timerState={...timerState,...x,handle:null}}}catch{}}

function renderInterval(){const p=intervalPlan[weekNo()-1];$('#interval').innerHTML=`<div class="card"><h2>${p.name}</h2><div class="grid3"><div><label>Serier</label><input id="tSets" type="number" value="1" min="1"></div><div><label>Drag per serie</label><input id="tReps" type="number" value="${p.reps||1}" min="1"></div><div><label>Seriepause</label><input id="tSetRest" type="number" value="120"></div></div><div class="grid2" style="margin-top:8px"><div><label>Oppvarming (sek)</label><input id="tWarm" type="number" value="600"></div><div><label>Nedtrapping (sek)</label><input id="tCool" type="number" value="300"></div></div><div id="tPhase" class="timer-phase badge" style="display:block;margin-top:14px">Oppvarming</div><div id="tClock" class="timer">10:00</div><div id="tCount" class="center muted">Serie 1 · Drag 1</div><div class="progressbar" style="margin:12px 0"><div id="tBar"></div></div><div class="controls"><button onclick="timerStart()">Start</button><button class="secondary" onclick="timerPause()">Pause</button><button class="danger" onclick="timerReset()">Nullstill</button></div><p class="muted center">Lyd/vibrasjon avhenger av innstillingene på telefonen.</p></div>`;loadTimerState();if(timerState.running){syncTimer();clearInterval(timerState.handle);timerState.handle=setInterval(syncTimer,250)}else setTimeout(timerUI,0)}
function phaseDuration(){const s=timerState,p=intervalPlan[weekNo()-1];return s.phase==='warmup'?+$('#tWarm').value:s.phase==='work'?(p.work||4)*60:s.phase==='rest'?(p.rest||2)*60:s.phase==='setrest'?+$('#tSetRest').value:s.phase==='cooldown'?+$('#tCool').value:0}
function timerUI(){if(!$('#tClock'))return;const s=timerState,m=String(Math.floor(s.remaining/60)).padStart(2,'0'),sec=String(s.remaining%60).padStart(2,'0');$('#tClock').textContent=`${m}:${sec}`;const names={warmup:'Oppvarming',work:'Arbeid',rest:'Rolig',setrest:'Seriepause',cooldown:'Nedtrapping',done:'Ferdig'};$('#tPhase').textContent=names[s.phase];$('#tCount').textContent=s.phase==='done'?'Bra gjennomført!':`Serie ${s.set} av ${+$('#tSets').value} · Drag ${s.rep} av ${+$('#tReps').value}`;const dur=phaseDuration()||1;$('#tBar').style.width=`${Math.max(0,100-(s.remaining/dur*100))}%`}
function ping(long=false){navigator.vibrate?.(long?[250,120,250]:120);try{const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);g.gain.value=.08;o.frequency.value=long?880:660;o.start();o.stop(a.currentTime+.12)}catch{}}
function nextTimer(){const s=timerState,sets=+$('#tSets').value,reps=+$('#tReps').value;if(s.phase==='warmup'){s.phase='work';s.remaining=(intervalPlan[weekNo()-1].work||4)*60}else if(s.phase==='work'){s.phase='rest';s.remaining=(intervalPlan[weekNo()-1].rest||2)*60}else if(s.phase==='rest'){if(s.rep<reps){s.rep++;s.phase='work';s.remaining=(intervalPlan[weekNo()-1].work||4)*60}else if(s.set<sets){s.phase='setrest';s.remaining=+$('#tSetRest').value}else{s.phase='cooldown';s.remaining=+$('#tCool').value}}else if(s.phase==='setrest'){s.set++;s.rep=1;s.phase='work';s.remaining=(intervalPlan[weekNo()-1].work||4)*60}else if(s.phase==='cooldown'){s.phase='done';s.remaining=0;timerPause();ping(true)}ping();timerUI()}
function syncTimer(){if(!timerState.running||!timerState.endAt)return;let now=Date.now();while(timerState.running&&timerState.phase!=='done'&&now>=timerState.endAt){const over=now-timerState.endAt;nextTimer();if(timerState.phase!=='done'){timerState.endAt=now-over+timerState.remaining*1000}}if(timerState.running&&timerState.phase!=='done')timerState.remaining=Math.max(0,Math.ceil((timerState.endAt-now)/1000));saveTimerState();timerUI()}
window.timerStart=()=>{if(timerState.running||timerState.phase==='done')return;timerState.running=true;timerState.endAt=Date.now()+timerState.remaining*1000;saveTimerState();syncTimer();timerState.handle=setInterval(syncTimer,250)};
window.timerPause=()=>{if(timerState.running)syncTimer();clearInterval(timerState.handle);timerState.handle=null;timerState.running=false;timerState.endAt=null;saveTimerState();timerUI()};
window.timerReset=(refresh=true)=>{clearInterval(timerState.handle);timerState={running:false,phase:'warmup',remaining:$('#tWarm')?+$('#tWarm').value:600,rep:1,set:1,handle:null,endAt:null};saveTimerState();if(refresh)timerUI();else setTimeout(timerUI,0)};
document.addEventListener('visibilitychange',()=>{if(!document.hidden){loadTimerState();if(timerState.running){timerState.handle=setInterval(syncTimer,250);syncTimer()}}});
window.addEventListener('focus',()=>{loadTimerState();syncTimer()});
const BY_KEY='backyardTimerV1';
let byHandle=null;
function byDefault(){return {active:false,startAt:null,target:4,current:1,roundStart:null,rounds:[],finished:false,alerts:{}}}
function byState(){return {...byDefault(),...DB.get(BY_KEY,{})}}
function bySave(x){DB.set(BY_KEY,x)}
function clockText(ms){ms=Math.max(0,ms);const total=Math.floor(ms/1000),h=Math.floor(total/3600),m=Math.floor((total%3600)/60),sec=total%60;return `${h?String(h).padStart(2,'0')+':':''}${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`}

function byRequestNotifications(){
  if('Notification' in window && Notification.permission==='default'){
    Notification.requestPermission().catch(()=>{});
  }
}
function byAlertKey(round,seconds){return `${round}-${seconds}`}
function bySendAlert(seconds,round){
  const label=seconds===300?'5 minutter':seconds===60?'1 minutt':'10 sekunder';
  const title=`Backyard: ${label} til start`;
  const body=`Runde ${round} starter snart.`;
  const pattern=seconds===10?[180,80,180,80,350]:seconds===60?[220,100,220]:[180,100,180];
  navigator.vibrate?.(pattern);
  try{
    const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();
    o.connect(g);g.connect(a.destination);g.gain.value=.1;o.frequency.value=seconds===10?980:seconds===60?820:700;o.start();o.stop(a.currentTime+.22);
  }catch{}
  if('Notification' in window && Notification.permission==='granted'){
    try{new Notification(title,{body,tag:`backyard-${round}-${seconds}`,renotify:true})}catch{}
  }
}
function byCheckAlerts(s,now,nextStart){
  s.alerts=s.alerts||{};
  const remaining=Math.ceil((nextStart-now)/1000);
  let changed=false;
  for(const sec of [300,60,10]){
    const key=byAlertKey(s.current,sec);
    if(!s.alerts[key] && remaining<=sec && remaining>0){
      s.alerts[key]=true;changed=true;bySendAlert(sec,s.current);
    }
  }
  if(changed)bySave(s);
}
function renderBackyard(){const s=byState();clearInterval(byHandle);const rows=s.rounds.map(r=>`<div class="history-item"><div class="row"><b>Runde ${r.round}</b><span>${clockText(r.durationMs)}</span></div><div class="muted">6,706 km · pause ${r.pauseMs==null?'–':clockText(r.pauseMs)}</div></div>`).join('');$('#backyard').innerHTML=`<div class="card hero"><span class="badge">6,706 km hver hele time</span><h2 style="margin-top:10px">Backyard-timer</h2><div class="muted">Klokken beregnes fra faktiske tidspunkter og fortsetter korrekt selv om telefonen låses.</div></div><div class="card">${!s.active&&!s.finished?`<h2>Start simulering</h2><div class="grid2"><div><label>Mål – antall runder</label><input id="byTarget" type="number" min="1" max="100" value="${s.target||4}"></div><div><label>Distanse per runde</label><input value="6,706 km" disabled></div></div><button class="full" style="margin-top:10px" onclick="byStart()">Start runde 1 nå</button>`:`<div id="byLive"></div>`}</div>${rows?`<div class="card"><h2>Fullførte runder</h2>${rows}</div>`:''}${(s.active||s.finished)?`<div class="card"><button class="full danger" onclick="byReset()">Nullstill Backyard-økt</button></div>`:''}`;if(s.active){byTick();byHandle=setInterval(byTick,500)}else if(s.finished)byFinishedUI()}
window.byStart=()=>{byRequestNotifications();const target=Math.max(1,+$('#byTarget').value||4),now=Date.now();const s={active:true,startAt:now,target,current:1,roundStart:now,rounds:[],finished:false,alerts:{}};bySave(s);renderBackyard()}
function byTick(){const s=byState();if(!s.active||!$('#byLive'))return;const now=Date.now(),slotStart=s.startAt+(s.current-1)*3600000,nextStart=s.startAt+s.current*3600000,elapsed=now-slotStart,countdown=nextStart-now,late=countdown<0;byCheckAlerts(s,now,nextStart);$('#byLive').innerHTML=`<div class="center"><span class="badge">Runde ${s.current} av ${s.target}</span><div class="timer">${clockText(elapsed)}</div><div class="muted">Tid siden rundestart</div></div><div class="grid2" style="margin-top:14px"><div class="kpi center"><div class="muted">Neste start</div><div class="stat" style="font-size:20px">${late?'START NÅ':clockText(countdown)}</div></div><div class="kpi center"><div class="muted">Fullført</div><div class="stat" style="font-size:20px">${s.rounds.length} / ${s.target}</div></div></div><button class="full success" style="margin-top:12px" onclick="byFinishRound()">Fullfør runde ${s.current}</button><p class="muted center">Varsler ved 5 min, 1 min og 10 sek før neste start. Trykk når 6,706 km er fullført.</p>`}
window.byFinishRound=()=>{const s=byState();if(!s.active)return;const now=Date.now(),slotStart=s.startAt+(s.current-1)*3600000,durationMs=now-slotStart;s.rounds.push({round:s.current,durationMs,pauseMs:null,finishedAt:now});if(s.current>=s.target){s.active=false;s.finished=true;bySave(s);byLogSession(s);renderBackyard();ping(true);return}const nextStart=s.startAt+s.current*3600000;s.rounds[s.rounds.length-1].pauseMs=Math.max(0,nextStart-now);s.current++;s.roundStart=nextStart;bySave(s);ping();renderBackyard()}
function byLogSession(s){const arr=logs(),totalDist=+(s.rounds.length*6.706).toFixed(2),totalMin=Math.round((s.rounds.at(-1).finishedAt-s.startAt)/60000);arr.push({id:Date.now(),date:iso(),type:'run',name:'Backyard-simulering',duration:totalMin,distance:totalDist,reps:s.rounds.length,note:`${s.rounds.length} runder × 6,706 km`});DB.set('logs',arr)}
function byFinishedUI(){const s=byState();if(!$('#byLive'))return;const total=+(s.rounds.length*6.706).toFixed(2);$('#byLive').innerHTML=`<div class="center"><span class="badge ok">Ferdig</span><div class="timer" style="font-size:42px">${s.rounds.length} runder</div><div class="stat">${total} km</div><p class="muted">Økten er lagret i historikken.</p></div>`}
window.byReset=()=>{if(confirm('Nullstille Backyard-økten?')){clearInterval(byHandle);localStorage.removeItem(BY_KEY);renderBackyard()}}


function simplifyRoute(points,max=1200){if(points.length<=max)return points;const step=Math.ceil(points.length/max);return points.filter((_,i)=>i%step===0||i===points.length-1)}
function hav(a,b){const R=6371,toR=x=>x*Math.PI/180,dLat=toR(b[0]-a[0]),dLon=toR(b[1]-a[1]),la1=toR(a[0]),la2=toR(b[0]);const h=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function parseGPX(text){const xml=new DOMParser().parseFromString(text,'application/xml');if(xml.querySelector('parsererror'))throw new Error('Ugyldig GPX');const pts=[...xml.querySelectorAll('trkpt,rtept')].map(n=>[+n.getAttribute('lat'),+n.getAttribute('lon'),+(n.querySelector('ele')?.textContent||0)]).filter(x=>Number.isFinite(x[0])&&Number.isFinite(x[1]));if(pts.length<2)throw new Error('Fant ingen GPS-rute');let d=0,up=0;for(let i=1;i<pts.length;i++){d+=hav(pts[i-1],pts[i]);if(pts[i][2]&&pts[i-1][2]&&pts[i][2]>pts[i-1][2])up+=pts[i][2]-pts[i-1][2]}return {route:simplifyRoute(pts.map(x=>[x[0],x[1]])),distance:+d.toFixed(2),elevation:Math.round(up)}}
window.importGPXToWorkout=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const g=parseGPX(r.result);pendingRoute=g.route;if($('#runDist')&&!$('#runDist').value)$('#runDist').value=g.distance;if($('#runElev')&&!$('#runElev').value)$('#runElev').value=g.elevation;$('#runMapPreview').style.display='block';renderRouteMap('runMapPreview',g.route);toast('GPX-ruten er importert')}catch(err){alert(err.message)}};r.readAsText(f)}
function fallbackRoute(el,route){if(!route?.length){el.innerHTML='<div class="center muted" style="padding:90px 10px">Ingen rute å vise</div>';return}const xs=route.map(p=>p[1]),ys=route.map(p=>p[0]),minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys),dx=maxX-minX||1,dy=maxY-minY||1,pts=route.map(p=>`${20+(p[1]-minX)/dx*560},${210-(p[0]-minY)/dy*180}`).join(' ');el.innerHTML=`<svg class="route-fallback" viewBox="0 0 600 230" preserveAspectRatio="none"><polyline points="${pts}"/><circle cx="${20+(route[0][1]-minX)/dx*560}" cy="${210-(route[0][0]-minY)/dy*180}" r="6"/><circle class="end" cx="${20+(route.at(-1)[1]-minX)/dx*560}" cy="${210-(route.at(-1)[0]-minY)/dy*180}" r="6"/></svg>`}
function renderRouteMap(id,route){const el=document.getElementById(id);if(!el||!route?.length)return;if(typeof L==='undefined'){fallbackRoute(el,route);return}try{if(el._leaflet_id){el._leaflet_id=null;el.innerHTML=''}const map=L.map(el,{zoomControl:true,attributionControl:true});L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);const line=L.polyline(route,{color:'#2563eb',weight:4}).addTo(map);L.circleMarker(route[0],{radius:6,color:'#16a34a',fillOpacity:1}).addTo(map);L.circleMarker(route.at(-1),{radius:6,color:'#ef4444',fillOpacity:1}).addTo(map);map.fitBounds(line.getBounds(),{padding:[18,18]});setTimeout(()=>map.invalidateSize(),80)}catch{fallbackRoute(el,route)}}
function renderMap(){const routeLogs=[...logs()].reverse().filter(l=>l.route?.length);$('#map').innerHTML=`<div class="welcome"><div><h2>Kart & ruter</h2><div class="muted">GPS-spor importert fra Garmin GPX</div></div><span class="badge">${routeLogs.length} ruter</span></div><div class="card"><h2>Importer ny GPX</h2><p class="muted">Eksporter en aktivitet som GPX fra Garmin Connect. Ruten kan lagres sammen med en løpeøkt under «Økter». Her kan du forhåndsvise en fil.</p><input type="file" accept=".gpx,application/gpx+xml" onchange="previewStandaloneGPX(event)"><div id="standaloneMap" class="mapbox" style="margin-top:10px"></div></div><div class="card"><h2>Lagrede ruter</h2>${routeLogs.length?routeLogs.map((l,i)=>`<div class="history-item"><button class="list-button" onclick="showStoredRoute(${l.id})"><b>${fmtDate(l.date)} · ${l.name}</b><div class="muted">${l.distance??'–'} km · ${l.elevation??'–'} hm · ${kmPaceFromLog(l)}</div></button><div id="route-${l.id}" class="mapbox" style="display:none"></div></div>`).join(''):'<p class="muted">Ingen GPX-ruter lagret ennå.</p>'}</div>`}
window.previewStandaloneGPX=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const g=parseGPX(r.result);renderRouteMap('standaloneMap',g.route)}catch(err){alert(err.message)}};r.readAsText(f)}
window.showStoredRoute=id=>{const l=logs().find(x=>x.id===id),el=$('#route-'+id);if(!l||!el)return;const visible=el.style.display!=='none';el.style.display=visible?'none':'block';if(!visible)setTimeout(()=>renderRouteMap('route-'+id,l.route),30)}

function renderProgress(){const ms=DB.get('measures',[]),set=settings(),last=ms.at(-1),first=ms[0];const waistDiff=last?.waist&&first?.waist?(last.waist-first.waist).toFixed(1):'–';$('#progress').innerHTML=`<div class="card"><h2>Registrer fremgang</h2><div class="grid2"><div><label>Dato</label><input id="mDate" type="date" value="${iso()}"></div><div><label>Midje (cm)</label><input id="mWaist" type="number" step="0.1"></div><div><label>Vekt (kg)</label><input id="mWeight" type="number" step="0.1"></div><div><label>Hvilepuls</label><input id="mPulse" type="number"></div></div><textarea id="mNote" placeholder="Kommentar, søvn, energi eller bilder tatt"></textarea><button class="full" onclick="saveMeasure()">Lagre måling</button></div><div class="card"><h2>Kroppssammensetning</h2><div class="grid3"><div class="kpi"><div class="muted">Midje</div><div class="stat">${last?.waist??'–'}</div></div><div class="kpi"><div class="muted">Endring</div><div class="stat">${waistDiff}</div></div><div class="kpi"><div class="muted">Hvilepuls</div><div class="stat">${last?.restPulse??'–'}</div></div></div><canvas id="measureChart" class="chart" width="700" height="190" style="margin-top:12px"></canvas></div><div class="card"><h2>Daglige mål</h2>${macroRow('Protein',set.protein,'g')}${macroRow('Kalorier',set.calories,'kcal')}${macroRow('Kreatin',set.creatine,'g')}<p class="muted">Kalorimålet er et startpunkt. Midjemål og prestasjon over 3–4 uker avgjør om det bør justeres.</p></div>`;drawChart(ms)}
function macroRow(n,v,u){return `<div class="history-item"><div class="row"><b>${n}</b><span style="text-align:right">${v} ${u}</span></div></div>`}
window.saveMeasure=()=>{const arr=DB.get('measures',[]);arr.push({date:$('#mDate').value,waist:+$('#mWaist').value||null,weight:+$('#mWeight').value||null,restPulse:+$('#mPulse').value||null,note:$('#mNote').value});arr.sort((a,b)=>a.date.localeCompare(b.date));DB.set('measures',arr);toast('Målingen er lagret');renderProgress()}
function drawChart(ms){const c=$('#measureChart');if(!c||ms.length<2)return;const ctx=c.getContext('2d'),vals=ms.map(x=>x.waist).filter(Boolean);if(vals.length<2)return;ctx.clearRect(0,0,c.width,c.height);const min=Math.min(...vals)-1,max=Math.max(...vals)+1,pad=34;ctx.strokeStyle='#cbd5e1';ctx.beginPath();ctx.moveTo(pad,10);ctx.lineTo(pad,c.height-pad);ctx.lineTo(c.width-10,c.height-pad);ctx.stroke();ctx.strokeStyle='#2563eb';ctx.lineWidth=4;ctx.beginPath();vals.forEach((v,i)=>{const x=pad+i*(c.width-pad-20)/(vals.length-1),y=10+(max-v)*(c.height-pad-20)/(max-min);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();ctx.fillStyle='#64748b';ctx.font='22px system-ui';ctx.fillText(`${vals.at(-1)} cm`,pad+8,30)}
function renderHistory(){const ls=[...logs()].reverse();$('#history').innerHTML=`<div class="card"><h2>Treningshistorikk</h2>${weekStrip()}<div style="margin-top:10px">${ls.length?ls.map(l=>historyItem(l)).join(''):'<p class="muted">Ingen økter lagret ennå.</p>'}</div></div>`}
function historyItem(l){let detail='';if(l.type==='strength')detail=l.exercises.map(e=>{const done=e.sets.filter(s=>s.done).length,w=e.sets.find(s=>s.weight)?.weight;return `${e.name}: ${w??'–'} kg · ${done}/${e.sets.length} sett`}).join('<br>');else detail=`${l.duration??'–'} min · ${l.distance??'–'} km · pace ${l.pace||kmPaceFromLog(l)} · snittpuls ${l.avgHr??'–'} · maks ${l.maxHr??'–'} · ${l.elevation??'–'} hm · RPE ${l.rpe??'–'}${l.route?.length?'<br><button class=\"secondary\" style=\"margin-top:8px\" onclick=\"nav(\'map\')\">Vis rute i kart</button>':''}`;return `<div class="history-item"><button class="list-button" onclick="toggleDetail(${l.id})"><b>${fmtDate(l.date)} · ${l.name}</b><div class="muted">${l.type==='strength'?'Styrkeøkt':'Løpeøkt'}</div></button><div id="d${l.id}" class="muted" style="display:none">${detail}${l.note?'<br><i>'+l.note+'</i>':''}<br><button class="danger" style="margin-top:8px" onclick="deleteLog(${l.id})">Slett</button></div></div>`}
window.toggleDetail=id=>{const x=$('#d'+id);x.style.display=x.style.display==='none'?'block':'none'};window.deleteLog=id=>{if(confirm('Slette denne økten?')){DB.set('logs',logs().filter(x=>x.id!==id));renderHistory()}}
function renderSettings(){const s=settings();$('#settings').innerHTML=`<div class="card"><h2>Puls og program</h2><div class="grid2"><div><label>Programstart</label><input id="sStart" type="date" value="${s.startDate}"></div><div><label>Løpsdato</label><input id="sRace" type="date" value="${s.raceDate}"></div><div><label>Makspuls</label><input id="sMax" type="number" value="${s.maxHr}"></div><div><label>Melkesyreterskelpuls</label><input id="sLthr" type="number" value="${s.lthr}"></div><div><label>Rolig puls nedre</label><input id="sLow" type="number" value="${s.zoneLow}"></div><div><label>Rolig puls øvre</label><input id="sHigh" type="number" value="${s.zoneHigh}"></div></div>${zoneMarkup()}<button class="full" style="margin-top:10px" onclick="saveSettings()">Lagre innstillinger</button></div><div class="card"><h2>Kostholdsmål</h2><div class="grid3"><div><label>Protein g/dag</label><input id="sProtein" type="number" value="${s.protein}"></div><div><label>Kalorier</label><input id="sCalories" type="number" value="${s.calories}"></div><div><label>Kreatin g/dag</label><input id="sCreatine" type="number" value="${s.creatine}"></div></div></div><div class="card"><h2>Sikkerhetskopi</h2><button class="full secondary" onclick="exportData()">Eksporter data</button><label style="margin-top:9px"><span class="secondary" style="display:block;padding:11px;text-align:center;border-radius:11px;font-weight:750;color:#0f172a">Importer data</span><input id="importFile" type="file" accept="application/json" style="display:none" onchange="importData(event)"></label><button class="full danger" style="margin-top:9px" onclick="clearData()">Slett alle data</button></div><div class="card"><h2>GPX fra Garmin</h2><p class="muted">Appen bruker GPX-import i stedet for kontinuerlig GPS i telefonen. Det er mer robust når skjermen er låst og lar Fēnix 6 være hovedkilden for rute, distanse og høyde.</p></div>`}
window.saveSettings=()=>{DB.set('settings',{startDate:$('#sStart').value,raceDate:$('#sRace').value,maxHr:+$('#sMax').value,lthr:+$('#sLthr').value,zoneLow:+$('#sLow').value,zoneHigh:+$('#sHigh').value,protein:+$('#sProtein').value,calories:+$('#sCalories').value,creatine:+$('#sCreatine').value});toast('Innstillingene er lagret');renderHome()}
window.exportData=()=>{const blob=new Blob([JSON.stringify({version:2,settings:settings(),logs:logs(),measures:DB.get('measures',[])},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='terjes-treningsapp-backup.json';a.click();URL.revokeObjectURL(a.href)}
window.importData=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);DB.set('settings',d.settings||{});DB.set('logs',d.logs||[]);DB.set('measures',d.measures||[]);toast('Data er importert');renderHome()}catch{alert('Filen kunne ikke leses.')}};r.readAsText(f)}
window.clearData=()=>{if(confirm('Vil du slette alle treningsdata og målinger?')){localStorage.clear();location.reload()}}
function render(page){if(page==='home')renderHome();if(page==='plan')renderPlan();if(page==='workout')renderWorkout();if(page==='interval')renderInterval();if(page==='backyard')renderBackyard();if(page==='map')renderMap();if(page==='progress')renderProgress();if(page==='history')renderHistory();if(page==='settings')renderSettings()}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
renderHome();
</script>
</body>
