<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<title>Terjes treningsapp</title>
<style>
:root{--bg:#f1f5f9;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--accent:#2563eb;--accent2:#dbeafe;--ok:#15803d;--okbg:#dcfce7;--warn:#b45309;--warnbg:#fef3c7;--danger:#b91c1c;--dangerbg:#fee2e2}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:20;background:#0f172a;color:white;padding:14px 16px 12px}header h1{font-size:19px;margin:0}header p{margin:3px 0 0;color:#cbd5e1;font-size:12px}
main{max-width:760px;margin:auto;padding:12px 10px 92px}.page{display:none}.page.active{display:block}.card{background:var(--card);border-radius:16px;padding:15px;margin-bottom:11px;box-shadow:0 2px 12px rgba(15,23,42,.06)}
h2{font-size:18px;margin:0 0 10px}h3{font-size:15px;margin:14px 0 8px}.muted{font-size:12px;color:var(--muted)}.small{font-size:11px}.strong{font-weight:800}.stat{font-size:25px;font-weight:850}.center{text-align:center}
.row{display:flex;gap:8px;align-items:end}.row>*{flex:1}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
label{display:block;font-size:11px;color:var(--muted);margin:0 0 4px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:11px;background:#fff;color:var(--text)}textarea{min-height:72px;resize:vertical}button{border:0;border-radius:11px;padding:11px 13px;font-weight:750;background:var(--accent);color:#fff;cursor:pointer}.secondary{background:#e2e8f0;color:#0f172a}.success{background:var(--okbg);color:var(--ok)}.danger{background:var(--dangerbg);color:var(--danger)}.warn{background:var(--warnbg);color:var(--warn)}.full{width:100%}
.badge{display:inline-block;border-radius:999px;padding:5px 9px;background:var(--accent2);color:#1e40af;font-size:11px;font-weight:750}.badge.ok{background:var(--okbg);color:var(--ok)}.badge.warn{background:var(--warnbg);color:var(--warn)}
.hero{background:linear-gradient(135deg,#1e293b,#0f172a);color:white}.hero .muted{color:#cbd5e1}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.quick button{padding:9px 5px;font-size:11px;background:rgba(255,255,255,.12)}
.exercise{border-top:1px solid var(--line);padding:13px 0}.exercise:first-child{border-top:0}.ex-head{display:flex;gap:8px;justify-content:space-between;align-items:start}.ex-title{font-weight:800}.target{font-size:11px;color:var(--muted)}.set-row{display:grid;grid-template-columns:28px 1fr 1fr 1fr 36px;gap:6px;align-items:center;margin-top:7px}.set-row input{padding:9px 7px;text-align:center}.set-no{text-align:center;font-size:12px;font-weight:800}.check{width:34px;height:34px;padding:0;background:#e2e8f0;color:#334155}.check.done{background:var(--okbg);color:var(--ok)}
.weekbar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{background:#e2e8f0;border-radius:10px;text-align:center;padding:7px 2px;font-size:10px}.day.today{outline:2px solid var(--accent)}.day.done{background:var(--okbg);color:#166534}.day.planned{background:#dbeafe;color:#1e40af}
.timer{font-size:54px;font-weight:900;text-align:center;margin:13px 0 4px;font-variant-numeric:tabular-nums}.timer-phase{text-align:center}.controls{display:flex;gap:7px}.controls button{flex:1}.progressbar{height:9px;background:#e2e8f0;border-radius:999px;overflow:hidden}.progressbar>div{height:100%;background:var(--accent);width:0%}
.history-item{border-top:1px solid var(--line);padding:10px 0}.history-item:first-child{border-top:0}.list-button{width:100%;text-align:left;background:white;color:var(--text);padding:10px 0;border-radius:0}.kpi{padding:10px;border-radius:12px;background:#f8fafc}.chart{width:100%;height:190px;border:1px solid var(--line);border-radius:12px;background:#fff}.macro{height:10px;background:#e2e8f0;border-radius:999px;overflow:hidden}.macro span{display:block;height:100%;background:var(--accent)}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:white;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}nav button{max-width:130px;flex:1;background:white;color:#64748b;border-radius:0;padding:11px 3px;font-size:10px}nav button.active{color:var(--accent);font-weight:900}
.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 14px;border-radius:999px;font-size:12px;display:none;z-index:50}.toast.show{display:block}
@media(max-width:480px){.grid4{grid-template-columns:1fr 1fr}.row.mobile-stack{flex-direction:column;align-items:stretch}.quick{grid-template-columns:repeat(3,1fr)}.set-row{grid-template-columns:25px 1fr 1fr 1fr 34px}}
</style>
</head>
<body>
<header><h1>Terjes treningsapp</h1><p>Styrke · 45/15 · sone 2 · kroppssammensetning</p></header>
<main>
<section id="home" class="page active"></section>
<section id="workout" class="page"></section>
<section id="interval" class="page"></section>
<section id="backyard" class="page"></section>
<section id="progress" class="page"></section>
<section id="history" class="page"></section>
<section id="settings" class="page"></section>
</main>
<nav>
<button data-page="home" class="active">Hjem</button><button data-page="workout">Økt</button><button data-page="interval">Intervall</button><button data-page="backyard">Backyard</button><button data-page="progress">Fremgang</button><button data-page="history">Historikk</button><button data-page="settings">Mer</button>
</nav>
<div id="toast" class="toast"></div>
<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const DB={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){localStorage.setItem(k,JSON.stringify(v))}};
const defaultSettings={maxHr:192,zoneLow:140,zoneHigh:150,protein:190,calories:2700,creatine:5,startDate:new Date().toISOString().slice(0,10)};
const strength={
 mon:{name:'Styrke A – kort',type:'strength',ex:[
  {n:'Knebøy',sets:3,min:5,max:5,inc:2.5},{n:'Benkpress',sets:3,min:5,max:5,inc:2.5},{n:'Bulgarsk splittknebøy',sets:2,min:8,max:8,inc:2.5,note:'per bein'},{n:'Stående tåhev',sets:3,min:12,max:15,inc:2.5}]},
 fri:{name:'Styrke B – kort',type:'strength',ex:[
  {n:'Markløft',sets:3,min:5,max:5,inc:2.5},{n:'Benkpress',sets:3,min:5,max:5,inc:2.5},{n:'Kabelroing / nedtrekk',sets:2,min:8,max:12,inc:2.5},{n:'Sittende tåhev',sets:3,min:12,max:15,inc:2.5},{n:'Pallof press',sets:2,min:10,max:10,inc:1.25,note:'per side'}]}
};
const intervalPlan=[
 ['4 × 4 min',4,4,2],['5 × 5 min',5,5,2],['3 × 8 min',3,8,3],['6 × 2 min – lett',6,2,2],
 ['4 × 4 min',4,4,2],['5 × 5 min',5,5,2],['3 × 8 min',3,8,3],['4 × 3 min – lett',4,3,2],
 ['4 × 5 min',4,5,2],['3 × 8 min',3,8,3],['5 × 5 min',5,5,2],['5 × 3 min – lett',5,3,2],
 ['4 × 6 min',4,6,2],['3 × 10 min',3,10,3],['5 × 5 min',5,5,2],['4 × 3 min – lett',4,3,2],
 ['4 × 5 min',4,5,2],['3 × 8 min',3,8,3],['5 × 3 min – lett',5,3,2],['4 × 5 min',4,5,2],
 ['3 × 10 min',3,10,3],['5 × 5 min',5,5,2],['4 × 3 min – lett',4,3,2],['4 × 6 min',4,6,2],
 ['4 × 5 min',4,5,2],['3 × 8 min',3,8,3],['4 × 3 min – lett',4,3,2],['4 × 5 min',4,5,2],
 ['3 × 8 min',3,8,3],['Lett 4 × 3 min',4,3,2],['4 × 4 min kontrollert',4,4,2],['4 × 3 min',4,3,2],
 ['3 × 3 min lett',3,3,2],['20–25 min svært rolig',0,0,0]
].map(x=>({name:x[0],reps:x[1],work:x[2],rest:x[3]}));
const easyPlan=[45,50,55,45,55,60,60,45,60,60,65,50,65,65,70,50,65,60,45,70,70,75,50,75,70,60,50,70,60,50,50,45,40,30];
const longPlan=[90,105,120,90,120,130,140,100,130,140,150,105,150,160,180,120,150,165,120,180,195,210,120,210,210,0,120,0,180,0,120,90,60,0];
const backyardRounds={26:3,28:4,30:8};
const dayKeys=['sun','mon','tue','wed','thu','fri','sat'];
const dayNames={sun:'Søndag',mon:'Mandag',tue:'Tirsdag',wed:'Onsdag',thu:'Torsdag',fri:'Fredag',sat:'Lørdag'};
function iso(d=new Date()){const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)}
function fmtDate(s){return new Date(s+'T12:00:00').toLocaleDateString('nb-NO',{day:'numeric',month:'short',year:'numeric'})}
function settings(){return {...defaultSettings,...DB.get('settings',{})}}
function weekNo(date=new Date()){const start=new Date('2026-08-24T12:00:00');const d=new Date(date);const diff=Math.floor((d-start)/(86400000*7));return Math.max(1,Math.min(34,diff+1))}
function planned(key,w=weekNo()){
 if(key==='mon') return w>=33?{name:'Hvile / svært lett styrke',type:'rest',detail:'Ingen tung styrke siste 10–14 dager'}:strength.mon;
 if(key==='fri') return w>=21?{name:'Valgfri lett styrke / hvile',type:'rest',detail:'Prioriter løpsrestitusjon'}:strength.fri;
 if(key==='tue') return {name:'Rolig løping',type:'run',detail:`${easyPlan[w-1]} min · ca. 130–140 bpm`,minutes:easyPlan[w-1]};
 if(key==='thu'){
   const p=intervalPlan[w-1];
   if(w===34)return {name:'Svært rolig løping',type:'run',detail:'20–25 min svært rolig',minutes:25};
   return {name:`Mølleintervall – ${p.name}`,type:'interval',detail:`10 min oppvarming · ${p.name} · ${p.rest} min rolig pause · nedjogg`,plan:p};
 }
 if(key==='sun'){
   if(backyardRounds[w])return {name:'Backyard-simulering',type:'run',detail:`${backyardRounds[w]} × 6,706 km · start hver hele time`,minutes:backyardRounds[w]*60};
   if(w===28||w===30){};
   if(longPlan[w-1])return {name:'Langtur – rolig',type:'run',detail:`${Math.floor(longPlan[w-1]/60)}:${String(longPlan[w-1]%60).padStart(2,'0')} t · ca. 130–140 bpm`,minutes:longPlan[w-1]};
   return {name:'Hvile / restitusjon',type:'rest',detail:'Ingen langtur planlagt'};
 }
 return {name:'Hvile',type:'rest',detail:'Lett aktivitet og restitusjon'};
}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function nav(page){$$('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$$('.page').forEach(p=>p.classList.toggle('active',p.id===page));render(page)}
$$('nav button').forEach(b=>b.onclick=()=>nav(b.dataset.page));
function todayKey(){return dayKeys[new Date().getDay()]}
function logs(){return DB.get('logs',[])}
function latestExercise(name){return [...logs()].reverse().find(l=>l.type==='strength'&&l.exercises?.some(e=>e.name===name))?.exercises.find(e=>e.name===name)}
function suggest(ex){const prev=latestExercise(ex.n);if(!prev)return {weight:'',text:'Ingen tidligere økt'};const completed=prev.sets.length>=ex.sets&&prev.sets.every(s=>(+s.reps||0)>=ex.max&&s.done);const w=+prev.sets[0]?.weight||0;return {weight:w?(completed?w+ex.inc:w):'',text:completed?`Forslag: ${w+ex.inc} kg`:`Gjenta ${w||'samme'} kg`}}
function weekStrip(){const now=new Date(),mon=new Date(now);mon.setDate(now.getDate()-((now.getDay()+6)%7));const ls=logs();return `<div class="weekbar">${[0,1,2,3,4,5,6].map((i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);const id=iso(d),done=ls.some(x=>x.date===id),key=['mon','tue','wed','thu','fri','sat','sun'][i],isPlan=['mon','tue','wed','fri','sun'].includes(key);return `<div class="day ${done?'done':isPlan?'planned':''} ${id===iso()?'today':''}">${['Ma','Ti','On','To','Fr','Lø','Sø'][i]}<br>${d.getDate()}</div>`}).join('')}</div>`}
function renderHome(){const key=todayKey(),p=planned(key),w=weekNo();const ls=logs(),thisWeek=ls.filter(l=>{const d=new Date(l.date+'T12:00:00'),n=new Date();const m=new Date(n);m.setDate(n.getDate()-((n.getDay()+6)%7));m.setHours(0,0,0,0);return d>=m}).length;const ms=DB.get('measures',[]),last=ms.at(-1);$('#home').innerHTML=`
<div class="card hero"><span class="badge">Uke ${w} av 34</span><h2 style="margin-top:10px">${p.name}</h2><div class="muted">${dayNames[key]} · ${p.detail||''}</div><button class="full" style="margin-top:13px;background:white;color:#0f172a" onclick="startToday()">Åpne dagens økt</button><div class="quick"><button onclick="nav('interval')">Intervalltimer</button><button onclick="nav('backyard')">Backyard-timer</button><button onclick="nav('history')">Historikk</button></div></div>
<div class="card"><h2>Denne uken</h2>${weekStrip()}<div class="grid3" style="margin-top:12px"><div class="kpi"><div class="muted">Økter</div><div class="stat">${thisWeek}</div></div><div class="kpi"><div class="muted">Midje</div><div class="stat">${last?.waist??'–'}<small> cm</small></div></div><div class="kpi"><div class="muted">Vekt</div><div class="stat">${last?.weight??'–'}<small> kg</small></div></div></div></div>
<div class="card"><h2>Ukeplan</h2>${['mon','tue','wed','thu','fri','sat','sun'].map(k=>{const x=planned(k,w);return `<div class="history-item"><b>${dayNames[k]}</b><div>${x.name}</div><div class="muted">${x.detail||''}</div></div>`}).join('')}</div>`}
window.startToday=()=>{sessionStorage.setItem('selectedDay',todayKey());nav('workout')};
function renderWorkout(){const key=sessionStorage.getItem('selectedDay')||todayKey(),w=weekNo(),p=planned(key,w);let picker=`<div class="card"><div class="row"><div><label>Velg økt</label><select id="dayPick">${['mon','tue','thu','fri','sun'].map(k=>`<option value="${k}" ${k===key?'selected':''}>${dayNames[k]} – ${planned(k,w).name}</option>`).join('')}</select></div><div><label>Dato</label><input id="workDate" type="date" value="${iso()}"></div></div></div>`;
if(p.type==='strength'){$('#workout').innerHTML=picker+strengthForm(key,p)}
else if(p.type==='interval'){$('#workout').innerHTML=picker+runForm('interval',p)}
else if(p.type==='run'){$('#workout').innerHTML=picker+runForm('run',p)}
else $('#workout').innerHTML=picker+`<div class="card"><h2>${p.name}</h2><p class="muted">Ingen planlagt treningsøkt denne dagen.</p></div>`;
$('#dayPick').onchange=e=>{sessionStorage.setItem('selectedDay',e.target.value);renderWorkout()}}
function strengthForm(key,p){return `<div class="card"><h2>${p.name}</h2><div class="muted">Registrer hvert sett. RPE 7–9 er passende på arbeidssettene.</div><div id="exerciseList">${p.ex.map((ex,ei)=>{const sg=suggest(ex);return `<div class="exercise" data-ex="${ei}"><div class="ex-head"><div><div class="ex-title">${ex.n}</div><div class="target">${ex.sets} × ${ex.min}${ex.max!==ex.min?'–'+ex.max:''} ${ex.note||''}</div></div><span class="badge ${sg.weight?'ok':''}">${sg.text}</span></div>${Array.from({length:ex.sets},(_,si)=>`<div class="set-row"><div class="set-no">${si+1}</div><input class="sw" inputmode="decimal" placeholder="kg" value="${sg.weight}"><input class="sr" inputmode="numeric" placeholder="reps"><input class="sp" inputmode="decimal" placeholder="RPE"><button class="check" onclick="this.classList.toggle('done');this.textContent=this.classList.contains('done')?'✓':'○'">○</button></div>`).join('')}<textarea class="en" placeholder="Kommentar til øvelsen"></textarea></div>`}).join('')}</div><textarea id="sessionNote" placeholder="Kommentar til hele økten"></textarea><button class="full success" onclick="saveStrength('${key}')">Lagre og fullfør økt</button></div>`}
window.saveStrength=key=>{const p=strength[key],cards=$$('#exerciseList .exercise');const exercises=cards.map((c,ei)=>({name:p.ex[ei].n,sets:[...c.querySelectorAll('.set-row')].map(r=>({weight:+r.querySelector('.sw').value||null,reps:+r.querySelector('.sr').value||null,rpe:+r.querySelector('.sp').value||null,done:r.querySelector('.check').classList.contains('done')})),note:c.querySelector('.en').value}));const arr=logs();arr.push({id:Date.now(),date:$('#workDate').value,type:'strength',name:p.name,day:key,exercises,note:$('#sessionNote').value});DB.set('logs',arr);toast('Styrkeøkten er lagret');nav('home')}
function runForm(type,p){const isInt=type==='interval',ip=p.plan;return `<div class="card"><h2>${p.name}</h2><div class="badge">${isInt?`${ip.name}`:p.detail}</div>${isInt?`<p class="muted">10 min oppvarming, ${ip.reps} × ${ip.work} min arbeid med ${ip.rest} min rolig pause, 5–10 min nedjogg.</p>`:`<p class="muted">Hold snakketempo. Senk farten dersom pulsen ligger over sone 2 over tid.</p>`}<div class="grid2" style="margin-top:12px"><div><label>Varighet (min)</label><input id="runTime" type="number" value="${isInt?'':p.minutes}"></div><div><label>Distanse (km)</label><input id="runDist" type="number" step="0.01"></div><div><label>Snittpuls</label><input id="runHr" type="number"></div><div><label>${isInt?'Fart på drag (km/t)':'Snittfart (km/t)'}</label><input id="runSpeed" type="number" step="0.1"></div><div><label>RPE</label><input id="runRpe" type="number" min="1" max="10"></div><div><label>Fullførte drag</label><input id="runReps" type="number" value="${isInt?ip.reps:''}"></div></div><textarea id="runNote" placeholder="Kommentar"></textarea><button class="full success" onclick="saveRun('${type}','${p.name}')">Lagre økt</button></div>`}
window.saveRun=(type,name)=>{const arr=logs();arr.push({id:Date.now(),date:$('#workDate').value,type,name,duration:+$('#runTime').value||null,distance:+$('#runDist').value||null,avgHr:+$('#runHr').value||null,speed:+$('#runSpeed').value||null,rpe:+$('#runRpe').value||null,reps:+$('#runReps').value||null,note:$('#runNote').value});DB.set('logs',arr);toast('Løpeøkten er lagret');nav('home')}
let timerState={running:false,phase:'warmup',remaining:600,rep:1,set:1,handle:null,endAt:null};
const TIMER_KEY='intervalTimerState';
function saveTimerState(){const {handle,...state}=timerState;localStorage.setItem(TIMER_KEY,JSON.stringify(state))}
function loadTimerState(){try{const x=JSON.parse(localStorage.getItem(TIMER_KEY)||'null');if(x&&x.phase){timerState={...timerState,...x,handle:null}}}catch{}}

function renderInterval(){const p=intervalPlan[weekNo()-1];$('#interval').innerHTML=`<div class="card"><h2>${p.name}</h2><div class="grid3"><div><label>Serier</label><input id="tSets" type="number" value="1" min="1"></div><div><label>Drag per serie</label><input id="tReps" type="number" value="${p.reps||1}" min="1"></div><div><label>Seriepause</label><input id="tSetRest" type="number" value="120"></div></div><div class="grid2" style="margin-top:8px"><div><label>Oppvarming (sek)</label><input id="tWarm" type="number" value="600"></div><div><label>Nedtrapping (sek)</label><input id="tCool" type="number" value="300"></div></div><div id="tPhase" class="timer-phase badge" style="display:block;margin-top:14px">Oppvarming</div><div id="tClock" class="timer">10:00</div><div id="tCount" class="center muted">Serie 1 · Drag 1</div><div class="progressbar" style="margin:12px 0"><div id="tBar"></div></div><div class="controls"><button onclick="timerStart()">Start</button><button class="secondary" onclick="timerPause()">Pause</button><button class="danger" onclick="timerReset()">Nullstill</button></div><p class="muted center">Lyd/vibrasjon avhenger av innstillingene på telefonen.</p></div>`;loadTimerState();if(timerState.running){syncTimer();clearInterval(timerState.handle);timerState.handle=setInterval(syncTimer,250)}else setTimeout(timerUI,0)}
function phaseDuration(){const s=timerState;return s.phase==='warmup'?+$('#tWarm').value:s.phase==='work'?45:s.phase==='rest'?15:s.phase==='setrest'?+$('#tSetRest').value:s.phase==='cooldown'?+$('#tCool').value:0}
function timerUI(){if(!$('#tClock'))return;const s=timerState,m=String(Math.floor(s.remaining/60)).padStart(2,'0'),sec=String(s.remaining%60).padStart(2,'0');$('#tClock').textContent=`${m}:${sec}`;const names={warmup:'Oppvarming',work:'Arbeid',rest:'Rolig',setrest:'Seriepause',cooldown:'Nedtrapping',done:'Ferdig'};$('#tPhase').textContent=names[s.phase];$('#tCount').textContent=s.phase==='done'?'Bra gjennomført!':`Serie ${s.set} av ${+$('#tSets').value} · Drag ${s.rep} av ${+$('#tReps').value}`;const dur=phaseDuration()||1;$('#tBar').style.width=`${Math.max(0,100-(s.remaining/dur*100))}%`}
function ping(long=false){navigator.vibrate?.(long?[250,120,250]:120);try{const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);g.gain.value=.08;o.frequency.value=long?880:660;o.start();o.stop(a.currentTime+.12)}catch{}}
function nextTimer(){const s=timerState,sets=+$('#tSets').value,reps=+$('#tReps').value;if(s.phase==='warmup'){s.phase='work';s.remaining=45}else if(s.phase==='work'){s.phase='rest';s.remaining=15}else if(s.phase==='rest'){if(s.rep<reps){s.rep++;s.phase='work';s.remaining=45}else if(s.set<sets){s.phase='setrest';s.remaining=+$('#tSetRest').value}else{s.phase='cooldown';s.remaining=+$('#tCool').value}}else if(s.phase==='setrest'){s.set++;s.rep=1;s.phase='work';s.remaining=45}else if(s.phase==='cooldown'){s.phase='done';s.remaining=0;timerPause();ping(true)}ping();timerUI()}
function syncTimer(){if(!timerState.running||!timerState.endAt)return;let now=Date.now();while(timerState.running&&timerState.phase!=='done'&&now>=timerState.endAt){const over=now-timerState.endAt;nextTimer();if(timerState.phase!=='done'){timerState.endAt=now-over+timerState.remaining*1000}}if(timerState.running&&timerState.phase!=='done')timerState.remaining=Math.max(0,Math.ceil((timerState.endAt-now)/1000));saveTimerState();timerUI()}
window.timerStart=()=>{if(timerState.running||timerState.phase==='done')return;timerState.running=true;timerState.endAt=Date.now()+timerState.remaining*1000;saveTimerState();syncTimer();timerState.handle=setInterval(syncTimer,250)};
window.timerPause=()=>{if(timerState.running)syncTimer();clearInterval(timerState.handle);timerState.handle=null;timerState.running=false;timerState.endAt=null;saveTimerState();timerUI()};
window.timerReset=(refresh=true)=>{clearInterval(timerState.handle);timerState={running:false,phase:'warmup',remaining:$('#tWarm')?+$('#tWarm').value:600,rep:1,set:1,handle:null,endAt:null};saveTimerState();if(refresh)timerUI();else setTimeout(timerUI,0)};
document.addEventListener('visibilitychange',()=>{if(!document.hidden){loadTimerState();if(timerState.running){timerState.handle=setInterval(syncTimer,250);syncTimer()}}});
window.addEventListener('focus',()=>{loadTimerState();syncTimer()});
const BY_KEY='backyardTimerV1';
let byHandle=null;
function byDefault(){return {active:false,startAt:null,target:4,current:1,roundStart:null,rounds:[],finished:false,alerts:{}}}
function byState(){return {...byDefault(),...DB.get(BY_KEY,{})}}
function bySave(x){DB.set(BY_KEY,x)}
function clockText(ms){ms=Math.max(0,ms);const total=Math.floor(ms/1000),h=Math.floor(total/3600),m=Math.floor((total%3600)/60),sec=total%60;return `${h?String(h).padStart(2,'0')+':':''}${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`}

function byRequestNotifications(){
  if('Notification' in window && Notification.permission==='default'){
    Notification.requestPermission().catch(()=>{});
  }
}
function byAlertKey(round,seconds){return `${round}-${seconds}`}
function bySendAlert(seconds,round){
  const label=seconds===300?'5 minutter':seconds===60?'1 minutt':'10 sekunder';
  const title=`Backyard: ${label} til start`;
  const body=`Runde ${round} starter snart.`;
  const pattern=seconds===10?[180,80,180,80,350]:seconds===60?[220,100,220]:[180,100,180];
  navigator.vibrate?.(pattern);
  try{
    const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();
    o.connect(g);g.connect(a.destination);g.gain.value=.1;o.frequency.value=seconds===10?980:seconds===60?820:700;o.start();o.stop(a.currentTime+.22);
  }catch{}
  if('Notification' in window && Notification.permission==='granted'){
    try{new Notification(title,{body,tag:`backyard-${round}-${seconds}`,renotify:true})}catch{}
  }
}
function byCheckAlerts(s,now,nextStart){
  s.alerts=s.alerts||{};
  const remaining=Math.ceil((nextStart-now)/1000);
  let changed=false;
  for(const sec of [300,60,10]){
    const key=byAlertKey(s.current,sec);
    if(!s.alerts[key] && remaining<=sec && remaining>0){
      s.alerts[key]=true;changed=true;bySendAlert(sec,s.current);
    }
  }
  if(changed)bySave(s);
}
function renderBackyard(){const s=byState();clearInterval(byHandle);const rows=s.rounds.map(r=>`<div class="history-item"><div class="row"><b>Runde ${r.round}</b><span>${clockText(r.durationMs)}</span></div><div class="muted">6,706 km · pause ${r.pauseMs==null?'–':clockText(r.pauseMs)}</div></div>`).join('');$('#backyard').innerHTML=`<div class="card hero"><span class="badge">6,706 km hver hele time</span><h2 style="margin-top:10px">Backyard-timer</h2><div class="muted">Klokken beregnes fra faktiske tidspunkter og fortsetter korrekt selv om telefonen låses.</div></div><div class="card">${!s.active&&!s.finished?`<h2>Start simulering</h2><div class="grid2"><div><label>Mål – antall runder</label><input id="byTarget" type="number" min="1" max="100" value="${s.target||4}"></div><div><label>Distanse per runde</label><input value="6,706 km" disabled></div></div><button class="full" style="margin-top:10px" onclick="byStart()">Start runde 1 nå</button>`:`<div id="byLive"></div>`}</div>${rows?`<div class="card"><h2>Fullførte runder</h2>${rows}</div>`:''}${(s.active||s.finished)?`<div class="card"><button class="full danger" onclick="byReset()">Nullstill Backyard-økt</button></div>`:''}`;if(s.active){byTick();byHandle=setInterval(byTick,500)}else if(s.finished)byFinishedUI()}
window.byStart=()=>{byRequestNotifications();const target=Math.max(1,+$('#byTarget').value||4),now=Date.now();const s={active:true,startAt:now,target,current:1,roundStart:now,rounds:[],finished:false,alerts:{}};bySave(s);renderBackyard()}
function byTick(){const s=byState();if(!s.active||!$('#byLive'))return;const now=Date.now(),slotStart=s.startAt+(s.current-1)*3600000,nextStart=s.startAt+s.current*3600000,elapsed=now-slotStart,countdown=nextStart-now,late=countdown<0;byCheckAlerts(s,now,nextStart);$('#byLive').innerHTML=`<div class="center"><span class="badge">Runde ${s.current} av ${s.target}</span><div class="timer">${clockText(elapsed)}</div><div class="muted">Tid siden rundestart</div></div><div class="grid2" style="margin-top:14px"><div class="kpi center"><div class="muted">Neste start</div><div class="stat" style="font-size:20px">${late?'START NÅ':clockText(countdown)}</div></div><div class="kpi center"><div class="muted">Fullført</div><div class="stat" style="font-size:20px">${s.rounds.length} / ${s.target}</div></div></div><button class="full success" style="margin-top:12px" onclick="byFinishRound()">Fullfør runde ${s.current}</button><p class="muted center">Varsler ved 5 min, 1 min og 10 sek før neste start. Trykk når 6,706 km er fullført.</p>`}
window.byFinishRound=()=>{const s=byState();if(!s.active)return;const now=Date.now(),slotStart=s.startAt+(s.current-1)*3600000,durationMs=now-slotStart;s.rounds.push({round:s.current,durationMs,pauseMs:null,finishedAt:now});if(s.current>=s.target){s.active=false;s.finished=true;bySave(s);byLogSession(s);renderBackyard();ping(true);return}const nextStart=s.startAt+s.current*3600000;s.rounds[s.rounds.length-1].pauseMs=Math.max(0,nextStart-now);s.current++;s.roundStart=nextStart;bySave(s);ping();renderBackyard()}
function byLogSession(s){const arr=logs(),totalDist=+(s.rounds.length*6.706).toFixed(2),totalMin=Math.round((s.rounds.at(-1).finishedAt-s.startAt)/60000);arr.push({id:Date.now(),date:iso(),type:'run',name:'Backyard-simulering',duration:totalMin,distance:totalDist,reps:s.rounds.length,note:`${s.rounds.length} runder × 6,706 km`});DB.set('logs',arr)}
function byFinishedUI(){const s=byState();if(!$('#byLive'))return;const total=+(s.rounds.length*6.706).toFixed(2);$('#byLive').innerHTML=`<div class="center"><span class="badge ok">Ferdig</span><div class="timer" style="font-size:42px">${s.rounds.length} runder</div><div class="stat">${total} km</div><p class="muted">Økten er lagret i historikken.</p></div>`}
window.byReset=()=>{if(confirm('Nullstille Backyard-økten?')){clearInterval(byHandle);localStorage.removeItem(BY_KEY);renderBackyard()}}

function renderProgress(){const ms=DB.get('measures',[]),set=settings(),last=ms.at(-1),first=ms[0];const waistDiff=last?.waist&&first?.waist?(last.waist-first.waist).toFixed(1):'–';$('#progress').innerHTML=`<div class="card"><h2>Registrer fremgang</h2><div class="grid2"><div><label>Dato</label><input id="mDate" type="date" value="${iso()}"></div><div><label>Midje (cm)</label><input id="mWaist" type="number" step="0.1"></div><div><label>Vekt (kg)</label><input id="mWeight" type="number" step="0.1"></div><div><label>Hvilepuls</label><input id="mPulse" type="number"></div></div><textarea id="mNote" placeholder="Kommentar, søvn, energi eller bilder tatt"></textarea><button class="full" onclick="saveMeasure()">Lagre måling</button></div><div class="card"><h2>Kroppssammensetning</h2><div class="grid3"><div class="kpi"><div class="muted">Midje</div><div class="stat">${last?.waist??'–'}</div></div><div class="kpi"><div class="muted">Endring</div><div class="stat">${waistDiff}</div></div><div class="kpi"><div class="muted">Hvilepuls</div><div class="stat">${last?.restPulse??'–'}</div></div></div><canvas id="measureChart" class="chart" width="700" height="190" style="margin-top:12px"></canvas></div><div class="card"><h2>Daglige mål</h2>${macroRow('Protein',set.protein,'g')}${macroRow('Kalorier',set.calories,'kcal')}${macroRow('Kreatin',set.creatine,'g')}<p class="muted">Kalorimålet er et startpunkt. Midjemål og prestasjon over 3–4 uker avgjør om det bør justeres.</p></div>`;drawChart(ms)}
function macroRow(n,v,u){return `<div class="history-item"><div class="row"><b>${n}</b><span style="text-align:right">${v} ${u}</span></div></div>`}
window.saveMeasure=()=>{const arr=DB.get('measures',[]);arr.push({date:$('#mDate').value,waist:+$('#mWaist').value||null,weight:+$('#mWeight').value||null,restPulse:+$('#mPulse').value||null,note:$('#mNote').value});arr.sort((a,b)=>a.date.localeCompare(b.date));DB.set('measures',arr);toast('Målingen er lagret');renderProgress()}
function drawChart(ms){const c=$('#measureChart');if(!c||ms.length<2)return;const ctx=c.getContext('2d'),vals=ms.map(x=>x.waist).filter(Boolean);if(vals.length<2)return;ctx.clearRect(0,0,c.width,c.height);const min=Math.min(...vals)-1,max=Math.max(...vals)+1,pad=34;ctx.strokeStyle='#cbd5e1';ctx.beginPath();ctx.moveTo(pad,10);ctx.lineTo(pad,c.height-pad);ctx.lineTo(c.width-10,c.height-pad);ctx.stroke();ctx.strokeStyle='#2563eb';ctx.lineWidth=4;ctx.beginPath();vals.forEach((v,i)=>{const x=pad+i*(c.width-pad-20)/(vals.length-1),y=10+(max-v)*(c.height-pad-20)/(max-min);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();ctx.fillStyle='#64748b';ctx.font='22px system-ui';ctx.fillText(`${vals.at(-1)} cm`,pad+8,30)}
function renderHistory(){const ls=[...logs()].reverse();$('#history').innerHTML=`<div class="card"><h2>Treningshistorikk</h2>${weekStrip()}<div style="margin-top:10px">${ls.length?ls.map(l=>historyItem(l)).join(''):'<p class="muted">Ingen økter lagret ennå.</p>'}</div></div>`}
function historyItem(l){let detail='';if(l.type==='strength')detail=l.exercises.map(e=>{const done=e.sets.filter(s=>s.done).length,w=e.sets.find(s=>s.weight)?.weight;return `${e.name}: ${w??'–'} kg · ${done}/${e.sets.length} sett`}).join('<br>');else detail=`${l.duration??'–'} min · ${l.distance??'–'} km · puls ${l.avgHr??'–'} · RPE ${l.rpe??'–'}`;return `<div class="history-item"><button class="list-button" onclick="toggleDetail(${l.id})"><b>${fmtDate(l.date)} · ${l.name}</b><div class="muted">${l.type==='strength'?'Styrkeøkt':'Løpeøkt'}</div></button><div id="d${l.id}" class="muted" style="display:none">${detail}${l.note?'<br><i>'+l.note+'</i>':''}<br><button class="danger" style="margin-top:8px" onclick="deleteLog(${l.id})">Slett</button></div></div>`}
window.toggleDetail=id=>{const x=$('#d'+id);x.style.display=x.style.display==='none'?'block':'none'};window.deleteLog=id=>{if(confirm('Slette denne økten?')){DB.set('logs',logs().filter(x=>x.id!==id));renderHistory()}}
function renderSettings(){const s=settings();$('#settings').innerHTML=`<div class="card"><h2>Innstillinger</h2><div class="grid2"><div><label>Programstart</label><input id="sStart" type="date" value="${s.startDate}"></div><div><label>Makspuls</label><input id="sMax" type="number" value="${s.maxHr}"></div><div><label>Sone 2 nedre</label><input id="sLow" type="number" value="${s.zoneLow}"></div><div><label>Sone 2 øvre</label><input id="sHigh" type="number" value="${s.zoneHigh}"></div><div><label>Protein (g/dag)</label><input id="sProtein" type="number" value="${s.protein}"></div><div><label>Kalorier (kcal/dag)</label><input id="sCalories" type="number" value="${s.calories}"></div><div><label>Kreatin (g/dag)</label><input id="sCreatine" type="number" value="${s.creatine}"></div></div><button class="full" style="margin-top:10px" onclick="saveSettings()">Lagre innstillinger</button></div><div class="card"><h2>Sikkerhetskopi</h2><button class="full secondary" onclick="exportData()">Eksporter data</button><label style="margin-top:9px"><span class="secondary" style="display:block;padding:11px;text-align:center;border-radius:11px;font-weight:750;color:#0f172a">Importer data</span><input id="importFile" type="file" accept="application/json" style="display:none" onchange="importData(event)"></label><button class="full danger" style="margin-top:9px" onclick="clearData()">Slett alle data</button></div><div class="card"><h2>Installering</h2><p class="muted">Når appen ligger på en nettside, velg «Legg til på Hjem-skjerm» i nettlesermenyen. Data lagres bare på denne enheten, så bruk sikkerhetskopi.</p></div>`}
window.saveSettings=()=>{DB.set('settings',{startDate:$('#sStart').value,maxHr:+$('#sMax').value,zoneLow:+$('#sLow').value,zoneHigh:+$('#sHigh').value,protein:+$('#sProtein').value,calories:+$('#sCalories').value,creatine:+$('#sCreatine').value});toast('Innstillingene er lagret');renderHome()}
window.exportData=()=>{const blob=new Blob([JSON.stringify({version:2,settings:settings(),logs:logs(),measures:DB.get('measures',[])},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='terjes-treningsapp-backup.json';a.click();URL.revokeObjectURL(a.href)}
window.importData=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);DB.set('settings',d.settings||{});DB.set('logs',d.logs||[]);DB.set('measures',d.measures||[]);toast('Data er importert');renderHome()}catch{alert('Filen kunne ikke leses.')}};r.readAsText(f)}
window.clearData=()=>{if(confirm('Vil du slette alle treningsdata og målinger?')){localStorage.clear();location.reload()}}
function render(page){if(page==='home')renderHome();if(page==='workout')renderWorkout();if(page==='interval')renderInterval();if(page==='backyard')renderBackyard();if(page==='progress')renderProgress();if(page==='history')renderHistory();if(page==='settings')renderSettings()}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
renderHome();
</script>
</body>
